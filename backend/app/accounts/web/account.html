<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号 · WaferAI 帮助中心</title><link rel="stylesheet" href="/account-assets/style.css"><script src="/account-assets/account.js" defer></script></head><body><main class="shell"><header><a href="/account">◈ WaferAI</a><span class="eyebrow">ACCOUNT / SUPPORT</span></header><section class="form panel"><span class="eyebrow">欢迎回来</span><h1>登录后获取帮助</h1><p>同一个 WaferAI 账号，可在 App 和帮助中心使用。晶圆和聊天记录仍保存在原设备。</p><nav class="tabs" aria-label="账号操作"><button data-mode="login" aria-pressed="true">登录</button><button data-mode="register" aria-pressed="false">注册</button><button data-mode="reset" aria-pressed="false">找回密码</button></nav><form id="form"><label for="target">邮箱或手机号</label><input id="target" maxlength="254" autocomplete="username" required placeholder="name@example.com 或 +8613800000000"><div id="name-field" hidden><label for="name">昵称</label><input id="name" maxlength="40" autocomplete="nickname"></div><div id="code-field" hidden><label for="code">验证码</label><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button id="send-code" type="button" class="secondary">获取验证码</button></div><label for="password">密码</label><input id="password" type="password" maxlength="128" autocomplete="current-password" required><p>注册和重置密码需 10–128 位，包含字母和数字。</p><label class="agree"><input type="checkbox" id="agreed"><span>我已阅读并同意<a href="/legal/terms" target="_blank" rel="noopener">使用条款</a>和<a href="/legal/privacy" target="_blank" rel="noopener">隐私政策</a>。</span></label><p id="message" class="message" role="status" aria-live="polite"></p><button id="submit" type="submit">登录</button></form><h2>其他方式</h2><div id="providers" class="providers"></div><p id="environment"></p></section></main></body></html>
